[project]
name = "paper-reading-assistant-api"
version = "1.0.0"
description = "Local API for the paper reading assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "openai>=2,<3",
    "paddleocr[doc-parser]>=3.7,<4",
    "paddlepaddle==3.2.2",
    "pypdfium2>=4,<6",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.40,<3",
    "uvicorn[standard]>=0.35,<1",
    "ftfy>=6,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
